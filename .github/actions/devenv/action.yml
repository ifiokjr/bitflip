name: Setup devenv
description: Install the pinned Nix, devenv, Flutter, Rust, and Serverpod toolchains
inputs:
  github-token:
    description: GitHub token used by Nix to avoid unauthenticated API limits
    required: true

runs:
  using: composite
  steps:
    # dprint formats Rust files in parallel. Each rustfmt starts rustup, and
    # the first devenv shell is what installs the toolchain from
    # rust-toolchain.toml. Concurrent downloads roll that install back, so
    # later cargo commands fail (the 2026-11-06 Android release job). Install
    # the toolchain once, before Nix or devenv, for every job that uses this
    # action.
    - name: Install pinned Rust toolchain before parallel formatter hooks
      shell: bash
      run: rustup toolchain install

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Install devenv with the shared binary cache
      run: |
        nix profile add --accept-flake-config nixpkgs#cachix
        cachix use devenv
        nix profile add nixpkgs#devenv
      shell: bash

    - name: Install pinned Flutter SDK
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version-file: .fvmrc
        cache: true
        pub-cache: true

    - name: Install locked workspace dependencies
      run: install:all
      shell: devenv shell bash -- -e {0}
