name: Setup devenv
description: Install the pinned Nix, devenv, Flutter, Rust, and Serverpod toolchains
inputs:
  github-token:
    description: GitHub token used by Nix to avoid unauthenticated API limits
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Install devenv with the shared binary cache
      run: |
        nix profile add --accept-flake-config nixpkgs#cachix
        cachix use devenv
        nix profile add nixpkgs#devenv
      shell: bash

    - name: Install pinned Flutter SDK
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version-file: .fvmrc
        cache: true
        pub-cache: true

    # Install the rust-toolchain.toml toolchain serially before devenv runs
    # any task. Otherwise every concurrent rustc/cargo/rustfmt shim (dprint
    # formats the generated client trees in parallel) triggers its own rustup
    # install of the same toolchain and the downloads race each other.
    - name: Install pinned Rust toolchain
      run: rustup toolchain install
      shell: bash

    - name: Install locked workspace dependencies
      run: install:all
      shell: devenv shell bash -- -e {0}
