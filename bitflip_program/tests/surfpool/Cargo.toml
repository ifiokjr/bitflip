[package]
name = "bitflip-program-surfpool-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The harness compiles the program source directly (`#[path = ...]`), so it
# needs the same pina crates the program's macros expand against.
pina = { version = "0.19.0", default-features = false, features = ["account-resize", "derive", "logs", "token", "validation"] }
pina_test = "0.18.0"
proptest = "=1.11.0"
solana-program-pack = "3.1.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "2.1.0"
