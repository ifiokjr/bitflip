[package]
name = "bitflip_program"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The bitflip program for on-chain deployment"

[lib]
crate-type = ["cdylib", "lib"]
name = "bitflip_program"

[dependencies]
bitflags = { workspace = true }
bytemuck = { workspace = true , default-features = true }
const_str_to_pubkey = { workspace = true }
default-env = { workspace = true }
derive_more = { workspace = true, features = ["add", "add_assign"] , default-features = true }
fixed = { workspace = true , default-features = true }
half = "=2.4.1"
log = { workspace = true, optional = true , default-features = true }
num_enum = { workspace = true , default-features = true }
serde = { workspace = true, features = ["derive"], optional = true , default-features = true }
serde-big-array = { workspace = true , default-features = true }
serde_with = { workspace = true, optional = true }
solana-package-metadata = { workspace = true }
solana-program = { workspace = true , default-features = true }
solana-sdk = { workspace = true, optional = true , default-features = true }
solana-security-txt = { workspace = true }
spl-associated-token-account = { workspace = true, features = ["no-entrypoint"] , default-features = true }
spl-pod = { workspace = true , default-features = true }
spl-token-2022 = { workspace = true, features = ["no-entrypoint"] , default-features = true }
spl-token-group-interface = { workspace = true , default-features = true }
spl-token-metadata-interface = { workspace = true , default-features = true }
spl-type-length-value = { workspace = true , default-features = true }
static_assertions = { workspace = true }
steel = { workspace = true, features = ["logs", "spl"] , default-features = true }
strum = { workspace = true, features = ["derive"], optional = true , default-features = true }
thiserror = { workspace = true , default-features = true }
typed-builder = { workspace = true, optional = true , default-features = true }
wasm_client_solana = { workspace = true, optional = true , default-features = true }

[dev-dependencies]
anyhow = { workspace = true , default-features = true }
assert2 = { workspace = true , default-features = true }
insta = { workspace = true, features = ["json", "redactions", "ron", "yaml"] , default-features = true }
rstest = { workspace = true , default-features = true }
serde_json = { workspace = true , default-features = true }
test-log = { workspace = true, features = ["log", "trace"] , default-features = true }

[features]
no-entrypoint = []
serde = [
	"dep:serde_with",
	"dep:serde",
	"spl-pod/serde-traits",
]
client = [
	"dep:log",
	"dep:solana-sdk",
	"dep:strum",
	"dep:typed-builder",
	"dep:wasm_client_solana",
	"serde",
]
ssr = ["wasm_client_solana?/ssr"]
js = [
	"no-entrypoint",
	"wasm_client_solana?/js",
]

[package.metadata.solana]
program-id = "5AuNvfV9Xi9gskJpW2qQJndQkFcwbWNV6fjaf2VvuEcM"
