[package]
name = "bitflip"
version = { workspace = true }
edition = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm-siv = { workspace = true, optional = true, features = ["std"] }
anyhow = { workspace = true , default-features = true }
argon2 = { workspace = true, optional = true, features = ["std"] }
axum = { workspace = true, optional = true, features = ["macros"] }
bitflip_program = { workspace = true, features = ["serde", "no-entrypoint", "client"] }
chrono = { workspace = true, features = ["serde", "clock"] , default-features = true }
codee = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
derive_more = { workspace = true, features = ["deref", "deref_mut", "from", "into", "debug"] , default-features = true }
fixed = { workspace = true , default-features = true }
http = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true, features = [] }
leptos-use = { workspace = true }
leptos_axum = { workspace = true, optional = true, features = [] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true, features = [] }
log = { workspace = true , default-features = true }
mime_guess = { workspace = true, optional = true }
num_enum = { workspace = true , default-features = true }
rand = { workspace = true, optional = true }
reactive_stores = { workspace = true }
rust-embed = { workspace = true, features = ["axum", "mime_guess", "tokio"], optional = true }
serde = { workspace = true, features = ["derive"] , default-features = true }
serde-big-array = { workspace = true , default-features = true }
simple_logger = { workspace = true }
solana-sdk = { workspace = true , default-features = true }
spl-pod = { workspace = true , default-features = true }
sqlx = { workspace = true, optional = true, features = ["chrono", "runtime-tokio", "uuid"] }
strum = { workspace = true, features = ["derive"] , default-features = true }
thiserror = { workspace = true , default-features = true }
tiny-skia = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], optional = true , default-features = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs", "compression-gzip", "compression-br"], optional = true }
tracing = { workspace = true, optional = true }
typed-builder = { workspace = true , default-features = true }
url = { workspace = true, features = ["serde"] , default-features = true }
uuid = { workspace = true, features = ["serde"] }
wallet_standard_browser = { workspace = true, features = ["solana"] }
wasm-bindgen = { workspace = true }
wasm_client_solana = { workspace = true , default-features = true }
web-sys = { workspace = true, features = ["DomRect", "CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "ImageData", "Window", "EventTarget"] }
welds = { workspace = true, features = ["sqlite", "check"], optional = true }

[dev-dependencies]
anyhow = { workspace = true , default-features = true }
assert2 = { workspace = true , default-features = true }
insta = { workspace = true, features = ["json", "redactions", "ron", "yaml"] , default-features = true }
memory_wallet = { workspace = true , default-features = true }
rstest = { workspace = true , default-features = true }
test-log = { workspace = true, features = ["log", "trace"] , default-features = true }
test_utils_insta = { workspace = true , default-features = true }
test_utils_keypairs = { workspace = true , default-features = true }
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time"] , default-features = true }

[features]
csr = [
	"codee/json_serde_wasm",
	"leptos/csr",
	"wasm_client_solana/js",
]
hydrate = [
	"codee/json_serde_wasm",
	"leptos/hydrate",
	"wasm_client_solana/js",
]
ssr = [
	"codee/json_serde",
	"dep:aes-gcm-siv",
	"dep:argon2",
	"dep:axum",
	"dep:leptos_axum",
	"dep:rand",
	"dep:rust-embed",
	"dep:sqlx",
	"dep:tiny-skia",
	"dep:tokio",
	"dep:tower-http",
	"dep:tower",
	"dep:tracing",
	"dep:welds",
	"leptos_meta/ssr",
	"leptos_router/ssr",
	"leptos-use/axum",
	"leptos-use/ssr",
	"leptos/ssr",
	"uuid/v7",
]
tracing = []

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "bitflip"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site/bitflip"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/output.css"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
watch-additional-files = ["style/output.css"]
