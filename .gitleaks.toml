[extend]
useDefault = true

# A Solana keypair file is a JSON array of 64 small integers
# (`solana-keygen new -o keypair.json`). The default rules match PEM keys, hex,
# and well-known token formats, but not that shape, so a committed keypair can
# pass unnoticed. `SECURITY.md` records exactly that class of leak from this
# repository's history.
[[rules]]
id = "solana-keypair-json-array"
description = "Solana keypair JSON array (64-byte secret key)"
regex = '''(?s)\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
entropy = 0

[allowlist]
description = "Generated dependencies, toolchains, build outputs, and local test ledgers"
paths = [
	'''(^|/)\.dart_tool/''',
	'''(^|/)\.devenv/''',
	'''(^|/)\.direnv/''',
	'''(^|/)\.fvm/''',
	'''(^|/)\.tools/''',
	'''(^|/)build/''',
	'''(^|/)node_modules/''',
	'''(^|/)target/''',
	# Regenerated by every local `solana-test-validator` / Anchor run. These are
	# throwaway localnet keys that are never committed; scanning them only
	# produces noise that hides real findings.
	'''(^|/)test-ledger/''',
	'''(^|/)\.anchor/test-ledger/''',
]
# The isolated SBF suite signs with a deliberately public, throwaway authority.
# It is documented as never-deployable and holds no value on any cluster.
regexTarget = "match"
regexes = [
	'''(?s)TEST_AUTHORITY_SECRET[\s\S]{0,300}?\]''',
	'''HMvYWLX41QFw8C3umdL1mbcRDyhGgLWKJK5Zf1dDvFm9''',
]
