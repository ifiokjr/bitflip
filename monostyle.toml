# monostyle's configuration for this repository.
#
# The ignore list names what a reader is not meant to read: generated
# output, vendored upstream sources, deliberately-broken test fixtures,
# and pure data tables. Everything authored and readable is measured with
# the default rules — no per-path threshold overrides.

[rules]
max-line-width = 100
tab-width = 2

[rules.ignore]
patterns = [
	"CHANGELOG.md",
	"**/CHANGELOG.md",
	"**/changelog.md",
	"**/*.g.dart",
	"**/*.freezed.dart",
	"**/*.pb.rs",
	"**/*.pb.go",
	"**/*.gen.ts",
	"**/*.min.js",
	"**/l10n/generated/**",
	"bitflip_app/web/wallet_bridge.js",
	"bitflip_program/clients/dart/lib/src/generated/**",
]
