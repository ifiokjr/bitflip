[workspace]
members = ["bitflip_program"]
exclude = ["bitflip_program/tests/surfpool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://bitflip.art"
license = "Apache-2.0"
repository = "https://github.com/ifiokjr/bitflip"
rust-version = "1.89.0"

[workspace.dependencies]
pina = { version = "0.12.2", default-features = false }

[workspace.metadata.bin]
pina_cli = { version = "0.12.2", bins = ["pina"], locked = true }

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
	'cfg(coverage)',
	'cfg(target_os, values("solana"))',
	'cfg(target_feature, values("static-syscalls"))',
]

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
tabs_in_doc_comments = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_imports = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3
