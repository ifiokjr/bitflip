[workspace]
members = ["bitflip", "bitflip_cli", "bitflip_program", "bitflip_program_test", "solapino"]
resolver = "2"

[workspace.package]
version = "0.0.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2021"
homepage = "https://bitflip.art"
license = "Apache-2.0"
repository = "https://github.com/ifiokjr/bitflip"
rust-version = "1.85.0"

[workspace.dependencies]
aes-gcm-siv = "0.11"
anyhow = { default-features = false, version = "^1" }
argon2 = "0.5"
assert2 = { default-features = false, version = "^0.3" }
assert_matches = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bincode = "1"
bip32 = "0.5"
bitflags = "2"
bs58 = "0.5"
bytemuck = { default-features = false, version = "^1" }
cfg-if = "1"
check_keyword = "0.4"
chrono = { version = "0.4", features = ["serde"], default-features = false }
chrono-humanize = "0.2"
codee = "0.3"
colored = "3"
console = "0.16"
console_error_panic_hook = "0.1"
console_log = "1"
const_str_to_pubkey = "0.2"
crossbeam-channel = "0.5"
cuid2 = "0.1"
default-env = "0.1"
deli = "0.2"
derive-where = "1"
derive_more = { default-features = false, version = "^2" }
dom_testing_library = "0.1"
dotenvy = "0.15"
env_logger = "0.11"
fake = "4"
fixed = { default-features = false, version = "=1.28" }
fixed_math = "0.4"
futures = "0.3"
futures-timeout = "0.1"
futures-timer = "3"
futures-util = "0.3"
gloo-console = "0.3"
gloo-events = "0.2"
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-utils = "0.2"
heck = "0.5"
hmac = "0.12"
http = "1"
hyper = "1"
idb = "0.6"
image = "0.25"
imagesize = "0.13"
indexmap = "2"
indicatif = "0.18"
insta = { default-features = false, version = "^1" }
js-sys = "=0.3.97"
jsonwebtoken = "9"
lazy_static = "1"
leptos = "0.8"
leptos-fetch = "0.4.4"
leptos-use = "0.16"
leptos_axum = "0.8"
leptos_dom = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
log = { default-features = false, version = "^0.4" }
memory_wallet = { default-features = false, version = "^0.1" }
mime_guess = "2"
num_enum = { default-features = false, version = "^0.7" }
paste = "1"
port_check = "0.3"
rand = "0.8"
reactive_stores = "0.2"
regex = "1"
retrier = "0.2"
rstest = { default-features = false, version = "^0.26" }
rust-embed = "8"
serde = { default-features = false, version = "^1" }
serde-big-array = { default-features = false, version = "^0.5" }
serde-wasm-bindgen = "0.6"
serde_json = { default-features = false, version = "^1" }
serde_qs = "0.15"
serde_with = "3"
server_fn = "0.8"
sha2 = "0.10"
similar-asserts = "1"
simple_logger = "5"
solana-address-lookup-table-program = "=2.1"
solana-banks-client = "=2.1"
solana-banks-interface = "=2.1"
solana-client = "=2.1"
solana-config-program = "=2.1"
solana-faucet = "=2.1"
solana-package-metadata = "=2.1"
solana-program = { default-features = false, version = "=2.1" }
solana-program-runtime = "=2.1"
solana-program-test = { default-features = false, version = "=2.1" }
solana-rpc = "=2.1"
solana-sdk = { default-features = false, version = "=2.1" }
solana-security-txt = "1"
solana-streamer = "=2.1"
solana-test-validator = "=2.1"
solana-version = "=2.1"
spl-associated-token-account = { default-features = false, version = "^6" }
spl-memo = "6"
spl-pod = { default-features = false, version = "^0.5" }
spl-tlv-account-resolution = "0.9"
spl-token = "7"
spl-token-2022 = { default-features = false, version = "^6" }
spl-token-group-interface = { default-features = false, version = "^0.5" }
spl-token-metadata-interface = { default-features = false, version = "^0.6" }
spl-transfer-hook-interface = "0.9"
spl-type-length-value = { default-features = false, version = "^0.7" }
sqlx = "0.8"
static_assertions = "1"
steel = { git = "https://github.com/ifiokjr/steel", rev = "1d3a37b", default-features = false }
strum = { default-features = false, version = "^0.27" }
tailwind_fuse = "0.3"
test-log = { default-features = false, version = "^0.2" }
test_utils_insta = { default-features = false, version = "^0.1" }
test_utils_keypairs = { default-features = false, version = "^0.1" }
test_utils_solana = { default-features = false, version = "^0.7" }
thiserror = { default-features = false, version = "^2" }
tiny-bip39 = "2"
tiny-skia = "0.11"
tokio = { default-features = false, version = "^1" }
tower = "0.5"
tower-http = "0.6"
tower_governor = "0.8"
tracing = "0.1"
typed-builder = { default-features = false, version = "^0.21" }
uint = "0.10"
url = { default-features = false, version = "^2" }
urlencoding = "2"
uuid = "1"
validator = { version = "0.20", features = ["derive"] }
wallet_standard = "0.4"
wallet_standard_browser = "0.4"
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "=0.4.70"
wasm-bindgen-test = "0.3"
wasm_client_solana = { default-features = false, version = "^0.8" }
web-sys = "=0.3.97"
welds = "0.4"

# internal crates
bitflip_program = { path = "./bitflip_program" }
bitflip_program_test = { path = "./bitflip_program_test" }
solapino = { path = "./solapino" }

[workspace.metadata.bin]
cargo-easy-dep = { version = "0.1.1" }
cargo-insta = { version = "1.43" }
cargo-interactive-update = { version = "0.6.2" }
cargo-leptos = { version = "0.3.7" }
cargo-llvm-cov = { version = "0.6.18" }
cargo-nextest = { version = "0.9.103" }
leptosfmt = { version = "0.1.33", bins = ["leptosfmt"], git = "https://github.com/bram209/leptosfmt", rev = "8b4194b" }
query-security-txt = { version = "1.1.1", bins = ["query-security-txt"] }
solana-verify = { version = "0.4.11", bins = ["solana-verify"] }
wasm-bindgen-cli = { version = "0.2.120", bins = ["wasm-bindgen"] }

[workspace.metadata.solana]
tools-version = "1.43"

[patch.crates-io]
# Solana 2.1's local `extract_if` polyfill collides with the standard-library
# method added in Rust 1.87. Remove this patch when the Steel dependency can
# move to a newer Solana release.
solana-unified-scheduler-pool = { path = "patches/solana-unified-scheduler-pool" }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release.package.bitflip_program]
overflow-checks = true
codegen-units = 1
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.release]
lto = "fat"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
# group
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# individual
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# group
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# individual
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
struct_field_names = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
