[workspace]
members = [
	"bitflip_program",
	"bitflip_program/clients/cli-rust/bitflip_program",
	"bitflip_program/clients/cpi/bitflip_program",
	"bitflip_program/clients/rust/bitflip_program",
]
exclude = ["bitflip_program/tests/surfpool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://bitflip.art"
license = "Apache-2.0"
repository = "https://github.com/ifiokjr/bitflip"
rust-version = "1.89.0"

[workspace.dependencies]
bs58 = { version = "^0.5.1", default-features = true }
clap = { version = "^4", default-features = true, features = ["derive", "std"] }
num-derive = { version = "^0.5", default-features = true }
num-traits = { version = "^0.2", default-features = true }
pina = { version = "0.17.0", default-features = false }
serde_json = { version = "^1", default-features = true, features = ["std"] }
solana-account-info = { version = "^3", default-features = true }
solana-cpi = { version = "^3", default-features = true }
solana-instruction = { version = "^3", default-features = true }
solana-program-error = { version = "^3", default-features = true }
solana-pubkey = { version = "^4", default-features = true, features = ["curve25519"] }
solana-rpc-client = { version = "^4", default-features = true }
solana-sdk = { version = "^4", default-features = true }
thiserror = { version = "^2", default-features = true }

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
	'cfg(coverage)',
	'cfg(target_os, values("solana"))',
	'cfg(target_feature, values("static-syscalls"))',
]

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
tabs_in_doc_comments = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_imports = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3
